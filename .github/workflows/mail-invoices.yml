name: Scan email for invoices

# Every three hours, ask the app to read the mailbox and log any invoices.
#
# This is a GitHub schedule and not a Vercel cron on purpose. Vercel's free
# plan only allows a cron that runs once a day, and a vercel.json asking for
# more does not just get ignored — it FAILS THE DEPLOYMENT. The app itself
# does the work; this only rings the bell.
#
# TWO THINGS THAT ARE EASY TO MISS
#  1. GitHub only runs `schedule` triggers from the repository's DEFAULT
#     branch, and only shows the manual "Run workflow" button for a workflow
#     that exists there too. Until this file is on `main`, neither works.
#     To try the pipeline before then, press "Scan now" in Settings >
#     Integrations, or POST to /api/cron/scan-invoices yourself with the secret.
#  2. Needs a repository secret CRON_SECRET, identical to the CRON_SECRET set
#     in Vercel. See docs/EMAIL-INVOICES.md.

on:
  schedule:
    # :17 rather than :00 — the top of the hour is when everyone's schedules
    # fire, and GitHub delays or drops the busiest ones.
    - cron: "17 */3 * * *"
  workflow_dispatch:

# Two scans at once would only duplicate the work the app already guards against.
concurrency:
  group: mail-invoices
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ask the app to scan
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          set -uo pipefail
          url="${APP_URL:-https://www.bolochai.com}/api/cron/scan-invoices"

          if [ -z "${CRON_SECRET:-}" ]; then
            # Not an error: this file lands before the setup does, and a red
            # cross every three hours until then would just train people to
            # ignore the Actions tab.
            echo "::warning::CRON_SECRET is not set as a repository secret, so nothing was scanned. See docs/EMAIL-INVOICES.md."
            exit 0
          fi

          code=$(curl -sS --max-time 90 -o resp.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer ${CRON_SECRET}" "$url") || {
            echo "::error::Could not reach $url"; exit 1; }

          # Counts only — the endpoint never returns anything from an email.
          cat resp.json; echo

          case "$code" in
            200) ;;
            503) echo "::warning::The app says email scanning is not configured yet (HTTP 503)."; exit 0 ;;
            401) echo "::error::CRON_SECRET here does not match the one in Vercel."; exit 1 ;;
            *)   echo "::error::Scan failed (HTTP $code)."; exit 1 ;;
          esac
